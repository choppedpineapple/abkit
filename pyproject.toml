[project]
name = "abkit"
version = "0.1.0"
description = "Fast antibody repertoire analysis and CDR3 clustering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hdbscan>=0.8.44",
    "polars>=1.43.2",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "memray>=1.20.0",
]
